
name: DEAD SECTOR Android Build

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

            - name: Install Android SDK packages
        run: |
          sdkmanager --licenses
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.1"

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.1"

      - name: Download Godot 4.7.2
        run: |
          curl -L --fail -o godot.zip \
            https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q godot.zip
          mv Godot_v4.7.2-stable_linux.x86_64 godot
          chmod +x godot

      - name: Install Android Export Templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates/4.7.2.stable
          curl -L --fail -o templates.tpz \
            https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          unzip -q templates.tpz -d templates
          cp templates/templates/* ~/.local/share/godot/export_templates/4.7.2.stable/

      - name: Validate project
        run: |
          ./godot --headless --editor --quit --path .

      - name: Export Android APK
        run: |
          mkdir -p build
          ./godot --headless --path . \
            --export-debug "Android" build/dead-sector-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DEAD-SECTOR-Android
          path: build/dead-sector-debug.apk
